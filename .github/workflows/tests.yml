# 每次推送代码或提交合并请求时，GitHub 自动在云端跑一遍全部测试
name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install pytest==9.1.1 httpx==0.28.1
      - name: 运行测试
        run: pytest
