# 和 A 股雷达系统同一套视觉：暖灰底、近黑主色、白色卡片
[server]
headless = true
port = 8502

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = true

[theme]
base = "light"
font = "-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif"
headingFont = "-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif"
baseFontSize = 14
primaryColor = "#1d1d1f"
backgroundColor = "#f5f5f3"
secondaryBackgroundColor = "#ecebe7"
textColor = "#1d1d1f"
linkColor = "#1d1d1f"
borderColor = "#e3e2de"
dataframeBorderColor = "#ecebe7"
dataframeHeaderBackgroundColor = "#fafaf8"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "10px"
buttonRadius = "8px"
redColor = "#d9363e"
greenColor = "#15935a"

[theme.sidebar]
backgroundColor = "#fbfbfa"
secondaryBackgroundColor = "#efeeea"
