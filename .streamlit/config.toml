# 和作品网站同一套视觉：浅灰底、白色卡片、近黑主色；英文和数字用 Inter（本地字体），中文用系统字体
[server]
headless = true
port = 8502
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = true

[theme]
base = "light"
font = "Inter, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
headingFont = "Inter, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
codeFont = "'SF Mono', ui-monospace, Menlo, Consolas, monospace"
baseFontSize = 14
primaryColor = "#0d0d0d"
backgroundColor = "#f7f7f8"
secondaryBackgroundColor = "#efeff1"
textColor = "#0d0d0d"
linkColor = "#0d0d0d"
borderColor = "#e7e7ea"
dataframeBorderColor = "#f1f1f3"
dataframeHeaderBackgroundColor = "#fafafa"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "12px"
buttonRadius = "full"
redColor = "#d9363e"
greenColor = "#15935a"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/inter.woff2"
weight = "100 900"

[theme.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f4f5"
